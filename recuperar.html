<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="GO Puntos: el programa de beneficios de CV Dietética. Sumá puntos con cada compra y canjealos por productos del local." />
  <meta name="theme-color" content="#1F4D3A" />
  <title>Recuperar contraseña | GO Puntos</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body data-layout="auth">
  <div class="auth">
    <aside class="auth__brand" aria-hidden="true" data-slot="auth-brand"></aside>
    <main class="auth__main" id="contenido">
      <a href="index.html" class="auth__mobile-logo" aria-label="GO Puntos, inicio" data-slot="auth-logo"></a>
      <div class="auth__form-wrap">

  <header class="auth-heading">
    <h1>Recuperá tu contraseña</h1>
    <p>Te mandamos un enlace para crear una nueva.</p>
  </header>

  <form class="auth-form" id="forgot-form" novalidate>
    <div class="field" data-field="email">
      <label for="email" class="field__label">Email de tu cuenta</label>
      <div class="field__control">
        <i data-lucide="mail" width="18" height="18" class="ic field__icon" aria-hidden="true"></i>
        <input id="email" name="email" type="email" class="field__input has-icon" autocomplete="email" />
      </div>
      <p class="field__error" id="email-error" hidden></p>
    </div>
    <button type="submit" class="btn btn--lg btn--block">Enviar enlace</button>
    <a href="login.html" class="link" style="justify-self:center">Volver a ingresar</a>
  </form>

  <div class="auth-form" id="forgot-done" hidden>
    <div data-sent-alert></div>
    <a href="login.html" class="btn btn--outline btn--block"><i data-lucide="arrow-left" width="18" height="18" class="ic"></i>Volver a ingresar</a>
  </div>
      </div>
    </main>
  </div>

  <!-- Iconos Lucide (se cargan desde internet) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Scripts compartidos: el orden importa, cada uno usa lo anterior -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/services.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/recuperar.js"></script>
</body>
</html>
