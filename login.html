<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="GO Puntos: el programa de beneficios de CV Dietética. Sumá puntos con cada compra y canjealos por productos del local." />
  <meta name="theme-color" content="#1F4D3A" />
  <title>Ingresar | GO Puntos</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body data-layout="auth" data-guest="true">
  <div class="auth">
    <aside class="auth__brand" aria-hidden="true" data-slot="auth-brand"></aside>
    <main class="auth__main" id="contenido">
      <a href="index.html" class="auth__mobile-logo" aria-label="GO Puntos, inicio" data-slot="auth-logo"></a>
      <div class="auth__form-wrap">

  <header class="auth-heading">
    <h1>Hola de nuevo</h1>
    <p>Ingresá para ver tus puntos y canjear recompensas.</p>
  </header>

  <form class="auth-form" id="login-form" novalidate>
    <div data-form-alert></div>
    <div class="field" data-field="email">
      <label for="email" class="field__label">Email</label>
      <div class="field__control">
        <i data-lucide="mail" width="18" height="18" class="ic field__icon" aria-hidden="true"></i>
        <input id="email" name="email" type="email" class="field__input has-icon" autocomplete="email" placeholder="nombre@correo.com" />
      </div>
      <p class="field__error" id="email-error" hidden></p>
    </div>
    <div class="field" data-field="password">
      <label for="password" class="field__label">Contraseña</label>
      <div class="field__control">
        <i data-lucide="lock" width="18" height="18" class="ic field__icon" aria-hidden="true"></i>
        <input id="password" name="password" type="password" class="field__input has-icon has-action" autocomplete="current-password" />
        <button type="button" class="field__action" data-toggle-password aria-label="Mostrar contraseña" aria-pressed="false">
          <span data-eye="open"><i data-lucide="eye" width="18" height="18" class="ic" aria-hidden="true"></i></span>
          <span data-eye="closed" hidden><i data-lucide="eye-off" width="18" height="18" class="ic" aria-hidden="true"></i></span>
        </button>
      </div>
      <p class="field__error" id="password-error" hidden></p>
    </div>
    <div class="auth-form__row">
      <label for="remember" class="checkbox">
        <input id="remember" name="remember" type="checkbox" class="checkbox__input" checked />
        <span class="checkbox__box" aria-hidden="true"><i data-lucide="check" width="14" height="14" stroke-width="3" class="ic"></i></span>
        <span>Recordar sesión</span>
      </label>
      <a href="recuperar.html" class="link">Olvidé mi contraseña</a>
    </div>
    <button type="submit" class="btn btn--lg btn--block">Ingresar</button>
  </form>

  <section class="demo-box" aria-labelledby="demo-title">
    <h2 id="demo-title">Cuentas de prueba</h2>
    <p>Completan el formulario con datos ficticios.</p>
    <div class="demo-box__actions">
      <button type="button" class="btn btn--outline btn--sm" data-demo="cliente"><i data-lucide="user-round" width="17" height="17" class="ic"></i>Cliente</button>
      <button type="button" class="btn btn--outline btn--sm" data-demo="admin"><i data-lucide="shield-check" width="17" height="17" class="ic"></i>Administrador</button>
    </div>
  </section>

  <p class="auth-switch">¿Todavía no sumás puntos? <a href="registro.html" class="link">Creá tu cuenta gratis</a></p>
      </div>
    </main>
  </div>

  <!-- Iconos Lucide (se cargan desde internet) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Scripts compartidos: el orden importa, cada uno usa lo anterior -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/services.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
