<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="GO Puntos: el programa de beneficios de CV Dietética. Sumá puntos con cada compra y canjealos por productos del local." />
  <meta name="theme-color" content="#1F4D3A" />
  <title>Movimientos | GO Puntos</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body data-layout="app" data-area="cliente" data-nav="puntos.html">
  <a href="#contenido" class="skip-link">Saltar al contenido</a>
  <div class="app">
    <main class="app__main" id="contenido" tabindex="-1">

      <header class="screen-head">
        <a href="puntos.html" class="icon-btn" aria-label="Volver a mis puntos"><i data-lucide="arrow-left" width="19" height="19" class="ic" aria-hidden="true"></i></a>
        <h1 class="screen-head__title" style="font-size:var(--fs-xl)">Movimientos</h1>
      </header>

      <div id="totals" class="stack" style="grid-template-columns:1fr 1fr;grid-auto-flow:column"></div>

      <div style="display:flex;gap:var(--sp-2);margin:var(--sp-5) 0 var(--sp-4);overflow-x:auto" id="mov-filter" role="group" aria-label="Filtrar movimientos">
        <button type="button" class="chip is-on" data-filter="todos">Todos</button>
        <button type="button" class="chip" data-filter="compra">Compras</button>
        <button type="button" class="chip" data-filter="canje">Canjes</button>
        <button type="button" class="chip" data-filter="bonificacion">Bonificaciones</button>
      </div>

      <div class="card" id="mov-list" aria-busy="true"></div>
    </main>
  </div>

  <!-- Iconos Lucide (se cargan desde internet) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Scripts compartidos: el orden importa, cada uno usa lo anterior -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/services.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/movimientos.js"></script>
</body>
</html>
