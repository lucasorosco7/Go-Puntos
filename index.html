<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="GO Puntos: el programa de puntos de tus comercios favoritos. Sumá con cada compra y canjeá recompensas." />
  <meta name="theme-color" content="#1F4D3A" />
  <title>GO Puntos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
  <!--
    Aplica la paleta del negocio ANTES de pintar (evita el "parpadeo" del verde
    por defecto mientras carga Vue). Las pantallas públicas y de ingreso
    siempre usan la identidad de GO Puntos, por eso se omiten.
    Después, el router (src/router/index.js) mantiene la paleta correcta.
  -->
  <script>
    (function () {
      try {
        var publicas = ['/', '/ingresar', '/registro', '/registro-negocio', '/recuperar'];
        if (publicas.indexOf(location.pathname.replace(/\/+$/, '') || '/') !== -1) return;
        var mapa = JSON.parse(localStorage.getItem('gopuntos:tema') || 'null');
        if (!mapa) return;
        for (var k in mapa) document.documentElement.style.setProperty(k, mapa[k]);
      } catch (e) { /* sin almacenamiento: queda la paleta por defecto */ }
    })();
  </script>
</head>
<body>
  <!-- Punto de montaje de la aplicación Vue -->
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
